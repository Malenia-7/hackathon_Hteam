services:
  db:          # サービス名（MySQL コンテナ）
    build:
      context: ./Docker/MySQL
      dockerfile: Dockerfile
    platform: linux/x86_64  # M1 Mac 対応
    volumes:
      - mysql_data:/var/lib/mysql  # データを永続化
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s  # 10秒各1回確認
    env_file: .env

  app:         # サービス名（Flask コンテナ）
    build:
      context: .
      dockerfile: Docker/Flask/Dockerfile
    volumes:
      - ./SNSApp:/code  # コードをリアルタイム共有
    ports:
      - "${FLASK_PORT}:5000"  # ホストのポート → コンテナの 5000番
    depends_on:
      db:
        condition: service_healthy  # db が起動完了後に起動
    env_file: .env